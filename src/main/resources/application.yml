spring:
  main:
    allow-circular-references: true
  application:
    name: usuarios
  datasource:
    url: ${MYSQL_DATABASE_URL:jdbc:mysql://localhost:3306/practica_final_backend}
    username: ${MYSQL_DATABASE_USER:root}
    password: ${MYSQL_DATABASE_PWD:admin}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
springdoc:
  swagger-ui:
    path: /fullstack.html
    operationsSorter: method
